name: Prepare clean host center link preview

on:
  push:
    branches:
      - preview-host-center-link-clean

permissions:
  contents: write

jobs:
  patch-link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-host-center-link-clean

      - name: Update link without changing line endings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          data = path.read_bytes()
          old = b'https://jwc95090-hash.github.io/trippick-site/admin'
          new = b'https://jwc95090-hash.github.io/trippick-site/trippick-host/admin-camp.html'
          if new in data:
              print('Host center link already updated.')
          elif old in data:
              path.write_bytes(data.replace(old, new, 1))
          else:
              raise SystemExit('Target link not found in index.html')
          PY

      - name: Commit preview change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix TRIPPICK host center link" || true
          git push origin HEAD:preview-host-center-link-clean

      - name: Package preview site
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-clean
          path: |
            .
            !.git/**
            !.github/**
          include-hidden-files: true
          retention-days: 1
