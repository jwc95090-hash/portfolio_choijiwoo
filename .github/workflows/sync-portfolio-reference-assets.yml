name: Sync portfolio reference assets

on:
  push:
    paths:
      - '.github/workflows/sync-portfolio-reference-assets.yml'

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download Daangn Figma render
        run: |
          mkdir -p /tmp/portfolio-sync assets/portfolio
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/08f3768c-ca76-47b4-90e9-396a99f9a90d.png' \
            --output /tmp/portfolio-sync/daangn-v4-full.png

      - name: Build exact Daangn v5 image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          out = Path('assets/portfolio')
          out.mkdir(parents=True, exist_ok=True)

          # The Figma source is 1920px wide, but long-frame export is proportionally
          # downscaled by Figma. Convert the 1054.667px source Contents height to the
          # downloaded image scale before cropping.
          with Image.open('/tmp/portfolio-sync/daangn-v4-full.png') as im:
              source_width = 1920
              contents_height = 1054.66748046875
              scale = im.width / source_width
              crop_y = round(contents_height * scale)
              v5 = im.crop((0, crop_y, im.width, im.height))
              target = out / 'daangn-realestate-ux-portfolio_revised_v5.png'
              v5.save(target, optimize=True)
              print(target, v5.size, target.stat().st_size, 'crop_y=', crop_y)
          PY

      - name: Commit corrected asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portfolio/daangn-realestate-ux-portfolio_revised_v5.png
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'Correct Daangn revised v5 portfolio crop'
          git push
