  <meta name="theme-color" content="#f7f7f7">
  <style>
    :root{--bg:#f7f7f7;--panel:rgba(255,255,255,.94);--text:#222;--line:rgba(0,0,0,.14);--accent:#ff6f0f}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow-x:hidden}
    .skip{position:fixed;left:50%;top:8px;z-index:1000;transform:translate(-50%,-160%);padding:10px 14px;border-radius:999px;background:#222;color:#fff;text-decoration:none;transition:.2s}
    .skip:focus{transform:translate(-50%,0)}
    .toolbar{position:fixed;z-index:100;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
    .toolbar__group{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);box-shadow:0 8px 26px rgba(0,0,0,.10);color:#222;text-decoration:none;font-size:13px;font-weight:700;backdrop-filter:blur(12px);cursor:pointer;white-space:nowrap}
    .btn--accent{border-color:var(--accent);background:var(--accent);color:#fff}
    .viewer{width:100%;overflow-x:hidden}
    .case-study{width:100%;max-width:1920px;margin:0 auto;background:#fff}
    .slice{display:block;width:100%;height:auto;margin:0;border:0}
    .viewer.is-native{overflow-x:auto}
    .viewer.is-native .case-study{width:1920px;max-width:none}
    :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    @media(max-width:700px){.toolbar{top:8px;left:8px;right:8px;align-items:flex-start}.toolbar__group{gap:6px}.btn{min-height:40px;padding:0 12px;font-size:11px}.toolbar__group--tools .btn:not(.btn--accent){display:none}}
    @media print{.toolbar,.skip{display:none}.viewer,.viewer.is-native{overflow:visible}.viewer.is-native .case-study{width:100%;max-width:1920px}}
  </style>
</head>

  <script>
    const viewer=document.getElementById('viewer');
    const toggle=document.getElementById('nativeSizeToggle');
    toggle.addEventListener('click',()=>{
      const native=viewer.classList.toggle('is-native');
      toggle.setAttribute('aria-pressed',String(native));
      toggle.textContent=native?'화면에 맞추기':'원본 크기 보기';
      if(native)viewer.scrollLeft=Math.max(0,(1920-viewer.clientWidth)/2);
    });
  </script>
