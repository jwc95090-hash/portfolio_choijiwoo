<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>TRIPPICK UX/UI Portfolio</title>
  <link rel="stylesheet" href="styles.css?v=20260830-trippick-typography">
</head>
<body class="portfolio-page portfolio-page-trippick">
  <main aria-label="TRIPPICK UX/UI 포트폴리오">
    <div class="figma-render-stack" aria-label="TRIPPICK UX/UI 포트폴리오 전체 화면">
      <img class="figma-render" src="assets/trippick-reviewed-01.jpg?v=20260830-typography" alt="TRIPPICK UX/UI 포트폴리오" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-02.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-03.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-04.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-05.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-06.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-07.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-08.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-09.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
      <img class="figma-render" src="assets/trippick-reviewed-10.jpg?v=20260830-typography" alt="" loading="lazy" decoding="async" draggable="false">
    </div>
  </main>
  <script>
    (() => {
      const image = document.querySelector('.portfolio-page-trippick .figma-render');
      const desktop = window.matchMedia('(min-width: 1024px)');

      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

      const centerPortfolio = () => {
        if (!desktop.matches) return;

        const overflow = document.documentElement.scrollWidth - window.innerWidth;
        if (overflow > 0) window.scrollTo(Math.round(overflow / 2), window.scrollY);
      };

      if (image.complete) {
        requestAnimationFrame(() => requestAnimationFrame(centerPortfolio));
      } else {
        image.addEventListener('load', centerPortfolio, { once: true });
      }

      window.addEventListener('load', centerPortfolio, { once: true });
    })();
  </script>
</body>
</html>
