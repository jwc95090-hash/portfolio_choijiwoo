<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>TRIPPICK UX/UI Portfolio</title>
  <link rel="stylesheet" href="styles.css?v=20260830-trippick-1920">
</head>
<body class="portfolio-page portfolio-page-trippick">
  <main aria-label="TRIPPICK UX/UI 포트폴리오">
    <img
      class="figma-render"
      src="https://www.figma.com/api/mcp/asset/d3898eed-1e1d-4137-a144-93eda4307661.png"
      data-figma-width="1920"
      data-figma-height="11978"
      alt="TRIPPICK UX/UI 포트폴리오 전체 화면"
      draggable="false"
      onerror="this.onerror=null;this.src='assets/trippick-fallback.jpg';">
    <noscript>
      <img class="figma-render" src="assets/trippick-fallback.jpg" alt="TRIPPICK UX/UI 포트폴리오 전체 화면">
    </noscript>
  </main>
  <script>
    (() => {
      const image = document.querySelector('.portfolio-page-trippick .figma-render');
      const desktop = window.matchMedia('(min-width: 1024px)');

      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

      const centerPortfolio = () => {
        if (!desktop.matches) return;

        const overflow = document.documentElement.scrollWidth - window.innerWidth;
        if (overflow > 0) window.scrollTo(Math.round(overflow / 2), window.scrollY);
      };

      if (image.complete) {
        requestAnimationFrame(() => requestAnimationFrame(centerPortfolio));
      } else {
        image.addEventListener('load', centerPortfolio, { once: true });
      }

      window.addEventListener('load', centerPortfolio, { once: true });
    })();
  </script>
</body>
</html>
