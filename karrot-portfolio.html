  <script>
    const viewer = document.getElementById('viewer');
    const toggle = document.getElementById('nativeSizeToggle');
    toggle.addEventListener('click', () => {
      const isNative = viewer.classList.toggle('is-native');
      toggle.setAttribute('aria-pressed', String(isNative));
      toggle.textContent = isNative ? '화면에 맞추기' : '원본 크기 보기';
      if (isNative) viewer.scrollLeft = Math.max(0, (1927 - viewer.clientWidth) / 2);
    });
  </script>
