  <style>
    :root { color-scheme: light; --bg: #f7f7f7; --panel: rgba(255,255,255,.9); --line: rgba(0,0,0,.16); --text: #262626; --focus: #ff6f0f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { overflow-x: hidden; font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .skip-link { position: fixed; top: 8px; left: 50%; z-index: 100; padding: 10px 14px; border-radius: 999px; background: #222; color: #fff; transform: translate(-50%, -160%); transition: transform .2s; }
    .skip-link:focus { transform: translate(-50%, 0); }
    .toolbar { position: fixed; z-index: 50; top: max(14px, env(safe-area-inset-top)); right: 14px; left: 14px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
    .toolbar a, .toolbar button { pointer-events: auto; min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); box-shadow: 0 8px 28px rgba(0,0,0,.1); color: var(--text); font: 700 13px/1 inherit; text-decoration: none; backdrop-filter: blur(12px); cursor: pointer; }
    .viewer { width: 100%; overflow-x: hidden; }
    .case-study { width: 100%; max-width: 1927px; margin: 0 auto; }
    .case-study img { display: block; width: 100%; max-width: none; height: auto; image-rendering: auto; }
    .viewer.is-native { overflow-x: auto; }
    .viewer.is-native .case-study { width: 1927px; max-width: none; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (max-width: 640px) { .toolbar { top: 9px; right: 9px; left: 9px; } .toolbar a, .toolbar button { min-height: 38px; padding: 0 12px; font-size: 12px; } }
    @media (prefers-reduced-motion: reduce) { .skip-link { transition: none; } }
    @media print { .toolbar, .skip-link { display: none; } .viewer, .viewer.is-native { overflow: visible; } .viewer.is-native .case-study { width: 100%; max-width: 1927px; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#case-study">케이스 스터디로 이동</a>
  <nav class="toolbar" aria-label="포트폴리오 보기 도구">
    <a href="index.html#projects">← 포트폴리오 홈</a>
    <button id="nativeSizeToggle" type="button" aria-pressed="false">원본 크기 보기</button>
  </nav>
  <main class="viewer" id="viewer">
    <article class="case-study" id="case-study" aria-labelledby="case-study-title">
      <header class="visually-hidden">
        <h1 id="case-study-title">당근부동산 UX/UI 리디자인 케이스 스터디</h1>
        <p>사용자 리뷰와 경쟁 서비스 분석을 바탕으로 거래 유형, 매물 신뢰 정보, 탐색과 비교 흐름을 개선하고 Figma 프로토타입으로 검증한 프로젝트입니다.</p>
      </header>
      <img src="assets/projects/karrot-case-study.jpg?v=20260826" width="1927" height="24770" alt="당근부동산 UX/UI 리디자인 케이스 스터디 전체 화면. 데스크 리서치, 경쟁사 분석, 페르소나, 사용자 여정, 문제 정의, 사용자 흐름, 정보 구조, 와이어프레임, 검증, 최종 UI와 디자인 시스템으로 구성되어 있습니다." fetchpriority="high" decoding="async">
    </article>
  </main>
  <script>
    const viewer = document.getElementById('viewer');
    const toggle = document.getElementById('nativeSizeToggle');
    toggle.addEventListener('click', () => {
      const isNative = viewer.classList.toggle('is-native');
      toggle.setAttribute('aria-pressed', String(isNative));
      toggle.textContent = isNative ? '화면에 맞추기' : '원본 크기 보기';
      if (isNative) viewer.scrollLeft = Math.max(0, (1927 - viewer.clientWidth) / 2);
    });
  </script>
</body>
</html>
